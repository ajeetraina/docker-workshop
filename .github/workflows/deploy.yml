name: Build Docs

# Builds the MkDocs site on every push/PR so the build is always validated.
# Deployment is handled by Vercel from the committed site/ directory.
on:
  push:
    branches:
      - main
      - lab8-sbx-ssh-module
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build -d site
